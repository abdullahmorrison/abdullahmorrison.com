name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # astro check type-checks .astro files, TypeScript, and content collection
      # frontmatter against its schema.
      - name: Check
        run: npm run lint

      - name: Build
        run: npm run build
